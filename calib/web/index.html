<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>attach 点校准</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <b>attach 点校准</b>
  <select id="mapSel" title="换地图"></select>
  <span id="binPath" class="muted">未打开</span>
  <span class="grow"></span>
  <label class="muted"><input type="checkbox" id="chkSpecial"> 含特殊地形</label>
  <span class="muted" id="counter">0 个点</span>
  <button id="btnReset">重置本次改动</button>
  <button id="btnClearMap" class="warn">清空本图校对</button>
  <button id="btnSave" class="primary">保存校对</button>
</header>

<main>
  <div id="stage">
    <img id="map" src="/map.png" alt="">
    <canvas id="cv"></canvas>
    <div id="tip" hidden></div>
    <div id="hint">拖动点 = 移动位置 · 点一下 = 选中 · Delete 键 = 标记删除</div>
  </div>

  <aside>
    <section class="card">
      <h3>选中 <span id="tag" class="tag"></span></h3>
      <div id="info" class="muted">点一个点</div>
    </section>
    <section class="card">
      <h3>改动 <span id="cnt" class="tag"></span></h3>
      <div id="list" class="list"></div>
    </section>
    <section class="card">
      <h3>说明</h3>
      <ol class="help">
        <li>拖动 = 改这个点的世界坐标（posX / posZ）</li>
        <li>Delete 或右键 = 标记删除（不会真删，只是记下来）</li>
        <li>再按一次 Delete / 点击「恢复」= 撤销</li>
        <li>保存后逐条核对再决定改不改</li>
      </ol>
    </section>
  </aside>
</main>
<script src="/app.js"></script>
</body>
</html>
